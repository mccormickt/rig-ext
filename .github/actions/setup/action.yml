name: Rust build tools
description: Install native prerequisites and optional pinned replay tools
inputs:
  workers:
    description: Install the Workers and replay toolchain
    default: 'false'
runs:
  using: composite
  steps:
    - name: Free runner space for native and guest builds
      shell: bash
      run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        components: clippy, rustfmt
        targets: wasm32-unknown-unknown
    - name: Install native prerequisites
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y protobuf-compiler clang lld pkg-config libssl-dev
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        cache-on-failure: true
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      if: inputs.workers == 'true'
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: scripts/workers/package-lock.json
    - name: Install pinned replay tools
      if: inputs.workers == 'true'
      shell: bash
      run: |
        scripts/workers/install.sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "ESBUILD_BIN=$GITHUB_WORKSPACE/scripts/workers/node_modules/.bin/esbuild" >> "$GITHUB_ENV"
