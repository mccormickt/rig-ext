[package]
name = "worker-replay-conformance"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "native-replay"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
rig-codemode = { path = "../..", default-features = false }
rig-core = { version = "0.44.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(target_family = "wasm")'.dependencies]
worker = "=0.8.3"

[features]
native = ["rig-codemode/quickjs"]
worker = ["rig-codemode/worker-replay"]

[profile.release]
opt-level = "s"
lto = true
