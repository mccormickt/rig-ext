[package]
name = "rig-codemode"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compose Rig tools with model-written JavaScript in a bounded sandbox"
readme = "README.md"

[[example]]
name = "explicit_host"
required-features = ["quickjs"]

[[example]]
name = "mcp_tools"
required-features = ["quickjs", "mcp"]

[[example]]
name = "sub_agents"
required-features = ["quickjs"]

[[test]]
name = "acceptance"
required-features = ["quickjs"]

[[test]]
name = "mcp"
required-features = ["quickjs", "mcp"]

[dependencies]
rig-codemode-core = { path = "../rig-codemode-core", version = "0.1.0", default-features = false }
rig-core.workspace = true
rig-rmcp = { version = "0.45.0", default-features = false, optional = true }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
rig-celld = { path = "../rig-celld", default-features = false, features = ["dynamic-workers"], optional = true }
worker = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
rig = { workspace = true, features = ["test-utils"] }
rmcp = { version = "3.6", features = ["server", "client"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = []
# Native QuickJS backend. Runs the script on a dedicated worker thread inside
# the host process; see the README for its threat model.
quickjs = ["rig-codemode-core/quickjs"]
# Replay-only QuickJS-WASM in fresh Dynamic Workers. Independent of native QuickJS.
worker-replay = ["dep:rig-celld", "dep:worker", "dep:futures-util"]
# Build the standalone Rust replay interpreter, not the host planner.
worker-runtime = ["rig-codemode-core/worker-runtime"]
# Catalog entries with output schemas from `rig-rmcp` tools, plus output-schema
# validation at the dispatch boundary.
mcp = ["dep:rig-rmcp", "rig-codemode-core/mcp"]

[lints]
workspace = true
