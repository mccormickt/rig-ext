[workspace]
resolver = "3"
members = [
  "rig-a2a",
  "rig-celld",
  "rig-celld/examples/celld-agent",
  "rig-celld/examples/celld-conformance",
  "rig-codemode",
  "rig-durable",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
duroxide = "0.1.30"
rig = "0.43.0"
rig-core = { version = "0.43.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
temporalio-client = "1.0.0"
temporalio-common = "1.0.0"
temporalio-sdk = "1.0.0"
temporalio-workflow = "1.0.0"
thiserror = "2"
worker = "=0.8.3"

[workspace.lints.clippy]
dbg_macro = "forbid"
expect_used = "deny"
panic = "deny"
todo = "forbid"
unimplemented = "forbid"
unwrap_used = "deny"
