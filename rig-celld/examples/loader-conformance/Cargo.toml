[package]
name = "loader-conformance"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rig-celld = { path = "../..", features = ["dynamic-workers"] }
serde_json = "1"
worker = "=0.8.3"

[profile.release]
opt-level = "s"
lto = true
