[package]
name = "rig-celld"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rig integrations for celld and workers-rs"

[[example]]
name = "mcp_call"
path = "examples/mcp/call.rs"
required-features = ["mcp-http"]

[[example]]
name = "mcp_code_mode"
path = "examples/mcp/code_mode.rs"
required-features = ["mcp-http"]

[[example]]
name = "http_tools"
path = "examples/mcp/http_tools.rs"
required-features = ["mcp-http"]

[dependencies]
base64 = { version = "0.22", optional = true }
jsonschema = { version = "0.58", default-features = false, optional = true }
rig-core.workspace = true
rmcp = { version = "=3.6.0", default-features = false, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = { version = "0.1", optional = true }
url = { version = "2", optional = true }
futures-util = { version = "0.3", optional = true }
worker = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
jsonschema = { version = "0.58", default-features = false, features = ["resolve-http", "resolve-file", "tls-aws-lc-rs"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
rig-codemode = { path = "../rig-codemode", features = ["quickjs"] }

[features]
default = []
dynamic-workers = ["dep:worker"]
storage = ["dep:worker"]
sqlite-vec = ["storage"]
mcp = ["dep:base64", "dep:jsonschema", "dep:rmcp", "dep:tracing"]
mcp-http = ["mcp", "dep:reqwest", "dep:worker", "dep:url", "dep:futures-util"]

[lints]
workspace = true
