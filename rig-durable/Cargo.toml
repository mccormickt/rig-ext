[package]
name = "rig-durable"
version.workspace = true
edition.workspace = true
license.workspace = true

[[example]]
name = "durable_agent"
required-features = ["duroxide", "sqlite"]

[[example]]
name = "human_approval"
required-features = ["duroxide", "sqlite"]

[[example]]
name = "sub_orchestration_tool"
required-features = ["duroxide", "sqlite"]

[[example]]
name = "checkpointed_agent"
required-features = ["duroxide", "sqlite"]

[[example]]
name = "streaming_agent"
required-features = ["duroxide", "sqlite"]

[[example]]
name = "temporal_retrying_tool"
required-features = ["temporal"]

[[example]]
name = "dynamic_workflow"
required-features = ["codemode", "sqlite"]

[dependencies]
duroxide = { workspace = true, optional = true }
futures = "0.3"
rig.workspace = true
rig-memory.workspace = true
rig-codemode = { path = "../rig-codemode", optional = true }
rig-celld = { path = "../rig-celld", features = ["storage"], optional = true }
worker = { workspace = true, optional = true }
semver = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
temporalio-common = { workspace = true, optional = true }
temporalio-sdk = { workspace = true, optional = true }
temporalio-workflow = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { version = "1", features = ["time"], optional = true }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rig-codemode = { path = "../rig-codemode", features = ["quickjs"], optional = true }

[dev-dependencies]
duroxide = { workspace = true, features = ["sqlite"] }
rig = { workspace = true, features = ["test-utils"] }
temporalio-client.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
default = ["duroxide", "sqlite"]
codemode = ["dep:rig-codemode"]
codemode-worker-replay = ["codemode", "durable-object", "rig-codemode/worker-replay"]
durable-object = ["dep:worker", "dep:rig-celld"]
duroxide = ["dep:duroxide", "dep:tokio"]
sqlite = ["duroxide", "duroxide/sqlite"]
temporal = [
  "dep:temporalio-common",
  "dep:temporalio-sdk",
  "dep:temporalio-workflow",
]

[lints]
workspace = true
