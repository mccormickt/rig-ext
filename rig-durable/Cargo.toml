[package]
name = "rig-durable"
version.workspace = true
edition.workspace = true
license.workspace = true

[[example]]
name = "durable_agent"
required-features = []

[[example]]
name = "human_approval"
required-features = []

[[example]]
name = "sub_orchestration_tool"
required-features = []

[[example]]
name = "checkpointed_agent"
required-features = []

[[example]]
name = "streaming_agent"
required-features = []

[dependencies]
duroxide.workspace = true
futures = "0.3"
rig.workspace = true
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
duroxide = { workspace = true, features = ["sqlite"] }
rig = { workspace = true, features = ["test-utils"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[features]
default = ["sqlite"]
sqlite = ["duroxide/sqlite"]
